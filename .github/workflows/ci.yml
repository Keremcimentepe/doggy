name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (build + xUnit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Doggy.slnx
      - run: dotnet build Doggy.slnx --no-restore -c Release
      - run: dotnet test Doggy.slnx --no-build -c Release --logger trx --results-directory TestResults
      - name: Annotate test results
        if: always()
        run: python3 .github/scripts/trx_summary.py TestResults
      - name: Annotate resolved packages
        if: always()
        run: dotnet list Doggy.slnx package --format json | python3 .github/scripts/nuget_summary.py

  web:
    name: Web (typecheck + Vitest + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # TEMPORARY: until package-lock.json is committed (generated on a dev machine), fall back to npm install.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - run: npm run build
      - name: Annotate test results and versions
        if: always()
        run: node ../.github/scripts/web_summary.mjs
